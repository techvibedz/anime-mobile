name = "pantoufa-video-proxy"
main = "worker.js"
compatibility_date = "2024-09-01"

# Deploy:
#   cd C:\anime-mobile\proxy
#   npx wrangler login
#   npx wrangler deploy
#
# After deploy, Cloudflare prints a URL like:
#   https://pantoufa-video-proxy.<your-subdomain>.workers.dev
# Put that value in lib/config.ts -> VIDEO_PROXY_BASE.
